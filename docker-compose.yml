services:
  postgres-db:
    restart: unless-stopped
    image: postgres:15-alpine
    container_name: hospeda_db
    environment:
      POSTGRES_DB: hospedasync_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env (bash scripts/gen_env.sh)}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:?defina no .env}
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c wal_keep_size=256MB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/01-replicator.sh:/docker-entrypoint-initdb.d/01-replicator.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospedasync_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - hospeda-net

  postgres-replica:
    restart: unless-stopped
    image: postgres:15-alpine
    container_name: hospeda_db_replica
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env (bash scripts/gen_env.sh)}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:?defina no .env}
      PRIMARY_HOST: postgres-db
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./deploy/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospedasync_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - hospeda-net

  redis-lock:
    restart: unless-stopped
    image: redis:7-alpine
    container_name: hospeda_redis_lock
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina no .env}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?defina no .env}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - hospeda-net

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management-alpine
    container_name: hospeda_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hospeda}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?defina no .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - hospeda-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: hospeda_gateway
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - WORKER_SERVICE_URL=http://worker-01:8001
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres-db:5432/hospedasync_db
      - DATABASE_REPLICA_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres-replica:5432/hospedasync_db
      - JWT_SECRET=${JWT_SECRET:?defina no .env}
      - JWT_TTL_MINUTES=${JWT_TTL_MINUTES:-30}
      - SERVICE_SECRET=${SERVICE_SECRET:?defina no .env}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?defina no .env}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-lock:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-hospeda}:${RABBITMQ_PASS:?defina no .env}@rabbitmq:5672/
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-lock:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - hospeda-net

  worker-01:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: hospeda_worker_01
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - GATEWAY_URL=http://api-gateway:8000
      - WORKER_ID=worker-01
      - PORT=8001
      - SELF_URL=http://worker-01:8001
      - PEER_WORKERS=http://worker-02:8002,http://worker-03:8003
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-lock:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-hospeda}:${RABBITMQ_PASS:?defina no .env}@rabbitmq:5672/
      - SWEEP_INTERVAL_SECONDS=${SWEEP_INTERVAL_SECONDS:-120}
      - SERVICE_SECRET=${SERVICE_SECRET:?defina no .env}
    depends_on:
      api-gateway:
        condition: service_healthy
      redis-lock:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://localhost:%s/health' % os.environ['PORT'], timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - hospeda-net

  worker-02:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: hospeda_worker_02
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - GATEWAY_URL=http://api-gateway:8000
      - WORKER_ID=worker-02
      - PORT=8002
      - SELF_URL=http://worker-02:8002
      - PEER_WORKERS=http://worker-01:8001,http://worker-03:8003
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-lock:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-hospeda}:${RABBITMQ_PASS:?defina no .env}@rabbitmq:5672/
      - SWEEP_INTERVAL_SECONDS=${SWEEP_INTERVAL_SECONDS:-120}
      - SERVICE_SECRET=${SERVICE_SECRET:?defina no .env}
    depends_on:
      api-gateway:
        condition: service_healthy
      redis-lock:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://localhost:%s/health' % os.environ['PORT'], timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - hospeda-net

  worker-03:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: hospeda_worker_03
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      - GATEWAY_URL=http://api-gateway:8000
      - WORKER_ID=worker-03
      - PORT=8003
      - SELF_URL=http://worker-03:8003
      - PEER_WORKERS=http://worker-01:8001,http://worker-02:8002
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-lock:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-hospeda}:${RABBITMQ_PASS:?defina no .env}@rabbitmq:5672/
      - SWEEP_INTERVAL_SECONDS=${SWEEP_INTERVAL_SECONDS:-120}
      - SERVICE_SECRET=${SERVICE_SECRET:?defina no .env}
    depends_on:
      api-gateway:
        condition: service_healthy
      redis-lock:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://localhost:%s/health' % os.environ['PORT'], timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - hospeda-net

  nginx:
    image: nginx:1.27-alpine
    container_name: hospeda_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hospeda-net

networks:
  hospeda-net:
    driver: bridge

volumes:
  postgres_data:
  postgres_replica_data: