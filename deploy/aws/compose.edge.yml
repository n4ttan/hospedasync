# EC2-1 "edge": nginx (TLS) + api-gateway + rabbitmq + redis-lock.
# Uso (na raiz do repo):  docker compose -f deploy/aws/compose.edge.yml --env-file .env.aws up --build -d
# Certificado em deploy/nginx/certs (scripts/gen_selfsigned_cert.sh <IP_PUBLICO>).
services:
  redis-lock:
    restart: unless-stopped
    image: redis:7-alpine
    container_name: hospeda_redis_lock
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina no .env.aws}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?defina no .env.aws}
    ports:
      - "${EDGE_IP:?defina EDGE_IP}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - hospeda-net

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management-alpine
    container_name: hospeda_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hospeda}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?defina no .env.aws}
    ports:
      - "${EDGE_IP}:5672:5672"
      # painel de gerenciamento so no loopback (acesso por tunel SSH)
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - hospeda-net

  api-gateway:
    build:
      context: ../..
      dockerfile: api-gateway/Dockerfile
    container_name: hospeda_gateway
    restart: unless-stopped
    ports:
      # IP privado: os workers (outras EC2) chamam o gateway aqui; o mundo entra pelo nginx
      - "${EDGE_IP}:8000:8000"
      - "127.0.0.1:8000:8000"
    environment:
      - WORKER_SERVICE_URL=http://${WA_IP:?defina WA_IP}:8001
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?defina no .env.aws}@${WA_IP}:5432/hospedasync_db
      - DATABASE_REPLICA_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@${WB_IP:?defina WB_IP}:5432/hospedasync_db
      - JWT_SECRET=${JWT_SECRET:?defina no .env.aws}
      - JWT_TTL_MINUTES=${JWT_TTL_MINUTES:-30}
      - SERVICE_SECRET=${SERVICE_SECRET:?defina no .env.aws}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?defina no .env.aws}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-lock:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-hospeda}:${RABBITMQ_PASS}@rabbitmq:5672/
    depends_on:
      redis-lock:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - hospeda-net

  nginx:
    image: nginx:1.27-alpine
    container_name: hospeda_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - hospeda-net

networks:
  hospeda-net:
    driver: bridge
